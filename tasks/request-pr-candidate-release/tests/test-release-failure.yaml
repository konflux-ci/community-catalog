---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-release-failure
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Fail immediately on ManagedPipelineProcessed=False even when another condition is True
  tasks:
    - name: run-task
      taskRef:
        name: request-pr-candidate-release
      params:
        - name: SNAPSHOT
          value: release-failure
