---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-retest-comment
spec:
  description: |
    Check that a pull request Snapshot rebuilt by a /retest comment is released
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: retest-snapshot
        - name: RELEASE_PLAN
          value: dev-plan
