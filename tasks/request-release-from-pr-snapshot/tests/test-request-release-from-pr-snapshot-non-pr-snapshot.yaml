---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-non-pr-snapshot
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Check that the task fails for a Snapshot from a push event
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: push-snapshot
        - name: RELEASE_PLAN
          value: dev-plan
