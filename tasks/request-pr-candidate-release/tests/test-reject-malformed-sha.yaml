---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-reject-malformed-sha
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Reject a 39-character hexadecimal source revision before creating a Release
  tasks:
    - name: run-task
      taskRef:
        name: request-pr-candidate-release
      params:
        - name: SNAPSHOT
          value: reject-malformed-sha
