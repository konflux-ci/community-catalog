---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-auto-release-plan
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Check that the task fails for a ReleasePlan that is not labeled auto-release false
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: pr-snapshot
        - name: RELEASE_PLAN
          value: prod-plan
