---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-timeout
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Check that the task fails when the Release does not complete in time
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: pr-snapshot-stuck
        - name: RELEASE_PLAN
          value: dev-plan
        - name: TIMEOUT_SECONDS
          value: "3"
