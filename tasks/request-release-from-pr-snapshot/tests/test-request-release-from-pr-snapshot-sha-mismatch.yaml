---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-sha-mismatch
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Check that the task fails when the component revision does not match the pull request commit
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: sha-mismatch-snapshot
        - name: RELEASE_PLAN
          value: dev-plan
