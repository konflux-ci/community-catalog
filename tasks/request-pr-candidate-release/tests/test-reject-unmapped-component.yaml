---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-reject-unmapped-component
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Reject a supported application paired with the wrong component before creating a Release
  tasks:
    - name: run-task
      taskRef:
        name: request-pr-candidate-release
      params:
        - name: SNAPSHOT
          value: reject-unmapped-component
